name: Noticias de Barcelona

on:
  workflow_dispatch:

jobs:
  scraper-job:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargando el código del repositorio
      uses: actions/checkout@v4

    - name: 2. Configurando Python en el servidor
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Instalando librerías
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 4. Noticias de Barcelona (El País RSS)
      run: python barcelona_noticias.py
